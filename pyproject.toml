[project]
name = "alphaforge"
version = "0.1.0"
description = "Systematic algorithmic trading platform — research, backtest, paper, live."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AlphaForge" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "apscheduler>=3.10.4",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.1",
    "cryptography>=43.0.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "yfinance>=0.2.48",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
quant = [
    "polars>=1.14.0",
    "vectorbt>=0.26.0",
    "optuna>=4.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "statsmodels>=0.14.0",
]
brokers = [
    "alpaca-py>=0.30.0",
    "ccxt>=4.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "types-python-jose>=3.3.4",
]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/alphaforge"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""

[tool.hatch.build.targets.sdist]
include = ["backend/src/alphaforge"]

[tool.hatch.build]
dev-mode-dirs = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["alphaforge"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
mypy_path = "backend/src"
packages = ["alphaforge"]
exclude = ["notebooks", "frontend", "data"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "alpaca.*",
    "ccxt.*",
    "vectorbt.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend"]
addopts = "-q --strict-markers --cov=alphaforge --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend/src/alphaforge"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
